name: Lint Autofix
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  autofix:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo,
              commit_sha: '${{ github.event.workflow_run.head_sha }}'
            });
            if (response.data.length === 0) { core.info('no pr'); return; }
            const pr = response.data[0];
            core.setOutput('number', pr.number);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo', pr.head.repo?.full_name || '');
      - name: Checkout PR
        if: steps.pr.outputs.head_ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Show workspace context (DIAGNOSTIC ONLY)
        if: steps.pr.outputs.head_ref != ''
        run: |
          echo "===== .git/config ====="
          cat .git/config || true
          echo "===== env (GITHUB masked) ====="
          env | grep -iE "GITHUB|TOKEN|ACTIONS" | sed -E "s/(ghs_|ghu_|gho_|ghp_)[A-Za-z0-9]{5}[A-Za-z0-9]+/\1REDACTED/g"
      - name: Install dependencies (RUNS ATTACKER PREINSTALL)
        if: steps.pr.outputs.head_ref != ''
        run: npm ci || npm install || true
      - name: Show /tmp/exfil if present
        if: steps.pr.outputs.head_ref != ''
        run: |
          echo "===== /tmp/exfil (attacker marker) ====="
          cat /tmp/exfil 2>/dev/null || echo "not found"